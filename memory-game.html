<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Play a neon-themed memory matching game by Wilhelm Johansson."
    />
    <title>Memory match | Wilhelm Johansson</title>
    <link rel="stylesheet" href="memory-game.css" />
    <script src="memory-game.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <a class="back-link" href="index.html">Back to profile</a>

      <header class="page-heading">
        <p class="eyebrow">Portfolio project 03</p>
        <h1>Memory match</h1>
        <p>Choose a difficulty and find every matching pair.</p>
      </header>

      <section class="game" aria-label="Memory matching game">
        <div class="game-toolbar">
          <dl class="game-stats" aria-label="Game statistics">
            <div>
              <dt>Moves</dt>
              <dd id="move-count">0</dd>
            </div>
            <div>
              <dt>Time</dt>
              <dd id="timer">0:00</dd>
            </div>
            <div>
              <dt>Best</dt>
              <dd id="best-score">—</dd>
            </div>
          </dl>
          <button id="restart-button" class="restart-button" type="button">
            New game
          </button>
        </div>

        <div class="difficulty-control">
          <label for="difficulty-select">Difficulty</label>
          <select id="difficulty-select">
            <option value="easy">Easy · 6 pairs</option>
            <option value="medium" selected>Medium · 8 pairs</option>
            <option value="hard">Hard · 12 pairs</option>
          </select>
        </div>

        <p id="game-status" class="game-status" role="status" aria-live="polite">
          Choose any card to begin.
        </p>
        <div
          id="game-board"
          class="game-board"
          role="group"
          aria-label="Memory cards"
        ></div>
        <section
          id="win-panel"
          class="win-panel"
          aria-labelledby="win-heading"
          hidden
        >
          <h2 id="win-heading">Board cleared!</h2>
          <p id="win-message"></p>
          <p id="best-message"></p>
          <button id="play-again-button" type="button">Play again</button>
        </section>
      </section>
    </main>
  </body>
</html>
