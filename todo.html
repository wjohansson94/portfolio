<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do list | Wilhelm Johansson</title>
    <meta
      name="description"
      content="A JavaScript to-do list by Wilhelm Johansson with filters, search, due dates and saved tasks."
    />
    <meta name="theme-color" content="#090f18" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="todo.css" />
    <link rel="stylesheet" href="theme.css" />
    <script src="todo.js" defer></script>
  </head>
  <body>
    <main class="todo-card">
      <a class="back-link" href="index.html">Back to profile</a>
      <p class="eyebrow">Portfolio project 02</p>
      <h1>My to-do list</h1>
      <p class="intro">Add a task, then remove it when you are finished.</p>

      <form id="todo-form">
        <label for="task-input">New task</label>
        <div class="form-row">
          <input
            id="task-input"
            name="task"
            type="text"
            autocomplete="off"
            required
          />
          <button type="submit">Add task</button>
        </div>
        <div class="due-date-row">
          <label for="task-due-date">Due date (optional)</label>
          <input id="task-due-date" name="due-date" type="date" />
        </div>
      </form>

      <div class="search-row">
        <label for="task-search">Search tasks</label>
        <input
          id="task-search"
          name="search"
          type="search"
          placeholder="Search tasks"
        />
      </div>

      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">
          Active
        </button>
        <button type="button" data-filter="completed" aria-pressed="false">
          Completed
        </button>
      </div>

      <div class="sort-row">
        <label for="task-sort">Sort by</label>
        <select id="task-sort" name="sort">
          <option value="added">Added order</option>
          <option value="due-date">Due date (earliest first)</option>
          <option value="name">Name (A–Z)</option>
        </select>
      </div>

      <p id="task-summary">0 total · 0 active · 0 completed</p>
      <p id="status" class="status" aria-live="polite"></p>
      <p id="empty-state" class="empty-state" hidden></p>
      <ul id="task-list"></ul>
    </main>
  </body>
</html>
