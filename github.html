<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub repository explorer | Wilhelm Johansson</title>
    <meta
      name="description"
      content="Explore public GitHub profiles and search, filter, sort and favorite repositories. Built by Wilhelm Johansson."
    />
    <meta name="theme-color" content="#090f18" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="github.css" />
    <link rel="stylesheet" href="theme.css" />
    <script src="github.js" defer></script>
  </head>
  <body>
    <main class="lookup-shell">
      <a class="back-link" href="index.html">Back to profile</a>

      <header class="page-heading">
        <p class="eyebrow">Portfolio project 03</p>
        <h1>GitHub repository explorer</h1>
        <p>Explore a public profile and browse its repositories.</p>
      </header>

      <form id="search-form">
        <label for="username">GitHub username</label>
        <div class="search-row">
          <input
            id="username"
            name="username"
            type="text"
            placeholder="e.g. octocat"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            required
          />
          <button type="submit">Search</button>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="empty-state" class="empty-state">
        <p id="empty-message">Enter a GitHub username to get started.</p>
      </section>

      <section
        id="results"
        class="results"
        aria-label="GitHub profile results"
        hidden
      >
        <article class="profile-summary" aria-labelledby="profile-name">
          <img id="avatar" class="profile-avatar" alt="" />
          <div class="profile-details">
            <p class="eyebrow">Public GitHub profile</p>
            <h2 id="profile-name"></h2>
            <a id="profile-login" target="_blank" rel="noreferrer"></a>
            <p id="bio" class="profile-bio"></p>
            <p id="location" class="profile-location" hidden></p>
          </div>
          <a
            id="view-profile"
            class="profile-link"
            target="_blank"
            rel="noreferrer"
          >
            View profile on GitHub
          </a>
        </article>

        <dl class="stats" aria-label="Profile statistics">
          <div>
            <dt>Repositories</dt>
            <dd id="public-repos"></dd>
          </div>
          <div>
            <dt>Followers</dt>
            <dd id="followers"></dd>
          </div>
          <div>
            <dt>Following</dt>
            <dd id="following"></dd>
          </div>
        </dl>

        <section class="repositories" aria-labelledby="repositories-heading">
          <div class="section-heading">
            <h2 id="repositories-heading">Repositories</h2>
            <p id="repo-status" aria-live="polite"></p>
          </div>
          <div class="repo-controls">
            <div class="repo-search-control">
              <label for="repo-search">Search loaded repositories</label>
              <input
                id="repo-search"
                type="search"
                placeholder="Search names and descriptions"
              />
            </div>
            <div class="repo-filter-controls">
              <div>
                <label for="language-filter">Language</label>
                <select id="language-filter">
                  <option value="">All languages</option>
                </select>
              </div>
              <div>
                <label for="repo-sort">Sort by</label>
                <select id="repo-sort">
                  <option value="updated">Recently updated</option>
                  <option value="name">Name (A–Z)</option>
                  <option value="stars">Most stars</option>
                </select>
              </div>
              <label class="favorites-filter">
                <input id="favorites-only" type="checkbox" />
                <span>Favorites only</span>
              </label>
            </div>
          </div>
          <p id="repo-empty-state" class="repo-empty-state" hidden></p>
          <ul id="repo-list" class="repo-list"></ul>
          <div class="repo-pagination">
            <button id="previous-page" type="button" disabled>
              Previous
            </button>
            <p id="page-status" aria-live="polite"></p>
            <button id="next-page" type="button" disabled>Next</button>
          </div>
          <button id="load-more" class="load-more-button" type="button" hidden>
            Load more repositories
          </button>
        </section>
      </section>
    </main>
  </body>
</html>
